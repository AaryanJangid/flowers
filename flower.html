<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>My Love</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#050403;--ink:#f6ead8;--mute:#c9b79c}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;cursor:pointer}
canvas{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;display:block}
#t{position:fixed;left:0;right:0;top:calc(18% + env(safe-area-inset-top,0px));box-sizing:border-box;padding:0 24px;text-align:center;color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;opacity:0;transition:opacity 2.6s ease;pointer-events:none;text-shadow:0 2px 18px #000,0 0 8px #000}
#t.on{opacity:1}
#t small{display:block;font:11px/1 system-ui,sans-serif;letter-spacing:.4em;color:var(--mute);margin-bottom:12px}
#t h1{font-weight:500;font-size:clamp(38px,8vw,60px);margin:0 0 12px;line-height:1}
#t p{margin:0 auto;max-width:28em;font-size:clamp(14px,4vw,18px);line-height:1.7}

#romantic-popup {
    position: fixed;
    top: 38%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    color: #ff8a80;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: clamp(24px, 6vw, 38px);
    font-weight: 500;
    text-shadow: 0 0 20px rgba(255, 82, 82, 0.6), 0 2px 10px #000;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s ease;
    z-index: 100;
}
#romantic-popup.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
}
</style></head><body>
<canvas id="c"></canvas>
<div id="t"><small>FOREVER &amp; ALWAYS</small><h1>My Love</h1><p id="p"></p></div>
<div id="romantic-popup">You are my favorite notification</div>
<script>
(()=>{
const cv=document.getElementById('c'),g=cv.getContext('2d'),TAU=Math.PI*2;
const cl=(v,a,b)=>Math.max(a,Math.min(b,v)),ease=t=>1-Math.pow(1-cl(t,0,1),3),mix=(a,b,t)=>a+(b-a)*t;
const hs=(h,s,l,a=1)=>`hsla(${h},${cl(s,0,100)}%,${cl(l,2,97)}%,${a})`;
let seed=7;const R=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const mk=(w,h,ax,ay,fn)=>{const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.translate(ax,ay);fn(x);return{c,ax,ay}};

function rose(x,b,H,S,L){
 const Rr=100*(.3+.7*b);
 for(let i=0;i<5;i++){x.save();x.rotate(i*TAU/5+.3);x.beginPath();x.moveTo(0,0);x.quadraticCurveTo(-13,-Rr*.55,0,-Rr*1.1-4);x.quadraticCurveTo(13,-Rr*.55,0,0);x.fillStyle=hs(112,42,24);x.fill();x.restore()}
 [[8,1,0],[7,.78,.3],[6,.58,.15],[5,.4,.5],[4,.24,.2]].forEach(([n,k,o],ri)=>{
  const r=Rr*k,w=r*Math.sin(Math.PI/n)*1.7+2;
  x.save();x.shadowColor='rgba(0,0,0,.5)';x.shadowBlur=8;x.shadowOffsetY=1;
  for(let i=0;i<n;i++){x.save();x.rotate(o+i*TAU/n+ri*.7);
   x.beginPath();x.moveTo(0,0);x.bezierCurveTo(-w*1.05,-r*.1,-w*1.15,-r*.92,-w*.25,-r*.99);x.quadraticCurveTo(0,-r*1.05,w*.25,-r*.99);x.bezierCurveTo(w*1.15,-r*.92,w*1.05,-r*.1,0,0);
   const gr=x.createLinearGradient(0,0,0,-r);gr.addColorStop(0,hs(H,S,L-28));gr.addColorStop(.5,hs(H,S,L-4));gr.addColorStop(.93,hs(H,S-6,L+8));gr.addColorStop(1,hs(H,S-12,L+17));
   x.fillStyle=gr;x.fill();x.lineWidth=.8;x.strokeStyle=hs(H,S,L-16,.5);x.stroke();x.restore()}
  x.restore()});
 x.strokeStyle=hs(H,S,L-32,.75);x.lineWidth=1.5;x.beginPath();
 for(let a=0;a<13.8;a+=.15){const q=Rr*.2*(1-a/13.8),px=Math.cos(a)*q,py=Math.sin(a)*q;a?x.lineTo(px,py):x.moveTo(px,py)}x.stroke()}

function sun(x,b){
 const len=100*(.3+.7*b),wd=len*.2;
 for(let i=0;i<8;i++){x.save();x.rotate(i*TAU/8);x.beginPath();x.moveTo(0,0);x.quadraticCurveTo(-10,-len*.4,0,-len*.62-6);x.quadraticCurveTo(10,-len*.4,0,0);x.fillStyle=hs(105,45,26);x.fill();x.restore()}
 for(let ring=0;ring<2;ring++){const n=21,L=len*(ring?.84:1),o=ring?TAU/n/2:0;
  x.save();x.shadowColor='rgba(0,0,0,.4)';x.shadowBlur=4;
  for(let i=0;i<n;i++){x.save();x.rotate(o+i*TAU/n+ring*.05);
   x.beginPath();x.moveTo(-wd*.35,-L*.16);x.bezierCurveTo(-wd*1.25,-L*.4,-wd*.9,-L*.82,0,-L);x.bezierCurveTo(wd*.9,-L*.82,wd*1.25,-L*.4,wd*.35,-L*.16);
   const gr=x.createLinearGradient(0,-L*.16,0,-L);gr.addColorStop(0,hs(30,100,ring?36:42));gr.addColorStop(.55,hs(41,100,ring?46:52));gr.addColorStop(1,hs(49,100,ring?56:62));
   x.fillStyle=gr;x.fill();x.strokeStyle='rgba(150,70,0,.3)';x.lineWidth=.8;x.beginPath();x.moveTo(0,-L*.2);x.lineTo(0,-L*.88);x.stroke();x.restore()}
  x.restore()}
 const c=37*(.75+.25*b),gr=x.createRadialGradient(0,0,0,0,0,c);
 gr.addColorStop(0,hs(32,55,26));gr.addColorStop(.7,hs(26,60,13));gr.addColorStop(1,hs(70,40,20));
 x.fillStyle=gr;x.beginPath();x.arc(0,0,c,0,TAU);x.fill();
 for(let i=1;i<=85;i++){const a=i*2.39996,r=c*Math.sqrt(i/85)*.94,s=.8+r/c*1.5;x.fillStyle=hs(36,65,24+i%3*9,.9);x.beginPath();x.arc(Math.cos(a)*r,Math.sin(a)*r,s,0,TAU);x.fill()}}

function tul(x,b,H,S,L,H2){
 const h=170*(.52+.48*b),w=60*(.68+.32*b),o=b*b*.6;
 const pet=(tx,wl,wr,l,sh)=>{
  x.save();x.shadowColor='rgba(0,0,0,.35)';x.shadowBlur=6;
  x.beginPath();x.moveTo(0,0);x.bezierCurveTo(-wl,-h*.12,-wl*.9,-h*.72,tx,-h);x.bezierCurveTo(wr*.9,-h*.72,wr,-h*.12,0,0);
  let gr=x.createLinearGradient(0,0,0,-h);gr.addColorStop(0,hs(H,S,l-24));gr.addColorStop(.45,hs(H,S,l));gr.addColorStop(1,hs(H2,S-8,l+14));
  x.fillStyle=gr;x.fill();x.restore();
  gr=x.createLinearGradient(-w,0,w,0);gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(.3,'rgba(255,255,255,'+sh+')');gr.addColorStop(.6,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.2)');
  x.fillStyle=gr;x.fill();x.strokeStyle=hs(H,S,l-20,.35);x.lineWidth=.8;x.stroke();
  x.beginPath();x.moveTo(0,-h*.05);x.quadraticCurveTo(tx*.5,-h*.5,tx,-h*.93);x.stroke()};
 pet(-w*(.5+o*1.3),w*1.2,w*.3,L-10,.1);pet(w*(.5+o*1.3),w*.3,w*1.2,L-10,.05);
 pet(0,w,w,L+2,.18);
 pet(-w*(.3+o*.5),w*1.12,w*.12,L,.2);pet(w*(.3+o*.5),w*.12,w*1.12,L-3,.12);
 x.fillStyle=hs(114,36,22);x.beginPath();x.ellipse(0,1,w*.26,7,0,0,TAU);x.fill()}

const ST=[.12,.4,.7,1];
const PAL={rose:[[345,64,62],[336,72,50],[350,35,93],[38,62,86],[352,78,42],[8,74,64]],
 tul:[[352,82,46,16],[334,72,64,345],[48,95,54,54],[24,92,56,42],[280,48,52,310]],sun:[[42,100,50]]};
const V={rose:PAL.rose.map(p=>ST.map(b=>mk(240,240,120,120,x=>rose(x,b,...p)))),
 tul:PAL.tul.map(p=>ST.map(b=>mk(200,250,100,226,x=>tul(x,b,...p)))),
 sun:[ST.map(b=>mk(240,240,120,120,x=>sun(x,b)))]};

let F=[],GB=[],GF=[],P=[],W=1080,H=2400,D=1,cnt,T0=performance.now(),shown=false;
function build(){
 seed=7;cnt={rose:0,tul:0,sun:0};F=[];GB=[];GF=[];P=[];
 const n=55,dia=80;
 for(let i=0;i<n;i++){
  let ty;
  if(cnt.tul < 34) { ty = 'tul'; }
  else { ty = R() < 0.6 ? 'rose' : 'sun'; }

  const z=R(),vi=Math.floor(R()*PAL[ty].length),pc=PAL[ty][vi];
  const rad=dia/2*(.65+.55*z)*(ty=='sun'?1.12:1),h=H*(.2+.58*R());
  cnt[ty]++;
  const f={ty,z,rad,v:V[ty][vi],bc:hs(pc[0],pc[1],pc[2]-6),x:(i+.1+R()*.8)/n*W,y:H+2+z*8,h,l:(R()-.5)*W*.07,sp:.5+R()*.5,ph:R()*TAU,sw:4+R()*8,tilt:(R()-.5)*.8,d:.3+R()*2.2,gd:2+R(),bs:R()*1.1,bd:1.6+R()*.9,lv:[]};
  const nl=ty=='tul'?2:2+(R()<.5?1:0);
  for(let k=0;k<nl;k++){const side=k%2?1:-1;let L;
   if(ty=='tul'){const len=rad*(3+2*R());L={u:.03+k*.05,side,len,ang:.1+.14*R(),bend:side*len*.25,wid:len*.16}}
   else{const len=rad*(1.1+.7*R());L={u:.22+R()*.45,side,len,ang:.75+.45*R(),bend:side*len*.2,wid:len*.3}}
   f.lv.push(L)}
  F.push(f)}
 F.sort((a,b)=>a.z-b.z);
 for(let i=0;i<20;i++)GB.push({x:R()*W,h:H*(.25+.25*R()),w:4+R()*3,lean:(R()-.5)*H*.08,d:R()*2,l:22+R()*14,hu:105+R()*30,sp:.4+R()*.5,ph:R()*TAU,tall:1});
 for(let i=0;i<180;i++){const q=R();GF.push({x:R()*W,h:H*(.03+.07*q*q)+4,w:6+R()*6,lean:(R()-.5)*H*.04,d:R()*1.8,l:20+R()*26,hu:100+R()*38,sp:.6+R()*.8,ph:R()*TAU})}
 for(let i=0;i<35;i++)P.push({x:R()*W,y:R()*H,r:1+R()*1.5,ph:R()*TAU,sp:.4+R()*.8,vy:4+R()*8});
 
 document.getElementById('p').innerHTML=`Jese ye phool bina murjhay khil rhe h, wese hi mera pyaar bhi apke liye hamesa aise hi rahega aur kabhi kam nhi hoga.<br>`;
}

let romanticTimer = null;
window.addEventListener('pointerdown', (e)=>{
 const rect = cv.getBoundingClientRect();
 const clickX = ((e.clientX - rect.left) / rect.width) * W;
 const tNow = (performance.now() - T0) / 1000;
 const types = ['rose', 'tulip', 'sun'];
 const ty = types[Math.floor(Math.random()*types.length)];
 const vi = Math.floor(R()*PAL[ty].length);
 const pc = PAL[ty][vi];
 const z = 0.8;
 const rad = 40 * (.65+.55*z) * (ty=='sun'?1.12:1);
 const f = {
  ty, z, rad, v: V[ty][vi], bc: hs(pc[0], pc[1], pc[2]-6),
  x: clickX, y: H + 8, h: H * 0.45, l: 0,
  sp: 0.5, ph: Math.random()*TAU, sw: 4, tilt: 0,
  d: tNow, gd: 1.2, bs: 0.2, bd: 1.0, lv: []
 };
 F.push(f);

 const popup = document.getElementById('romantic-popup');
 popup.classList.add('show');
 clearTimeout(romanticTimer);
 romanticTimer = setTimeout(() => {
  popup.classList.remove('show');
 }, 1000);
});

function blade(b,t){
 const gr=ease((t-b.d)/(b.tall?3:1.8));if(gr<=0)return;
 const hh=b.h*gr,sw=Math.sin(t*b.sp+b.ph)*(b.tall?10:3)*gr,y0=H+3,tx=b.x+b.lean*gr+sw;
 g.beginPath();g.moveTo(b.x-b.w/2,y0);g.quadraticCurveTo(b.x-b.w*.2+b.lean*.3+sw*.3,y0-hh*.6,tx,y0-hh);
 g.quadraticCurveTo(b.x+b.w*.3+b.lean*.3+sw*.3,y0-hh*.55,b.x+b.w/2,y0);g.fillStyle=hs(b.hu,46,b.l);g.fill()}

function flower(f,t){
 const gr=ease((t-f.d)/f.gd);if(gr<=0)return;
 const sw=(Math.sin(t*f.sp+f.ph)+.4*Math.sin(t*f.sp*2.3+f.ph*1.7))*f.sw*(.35+.65*gr),A=(.4+.6*f.z);
 const pt=u=>{const m=1-u,a=m*m*m,b=3*m*m*u,c=3*m*u*u,d=u*u*u;
  return[a*f.x+b*(f.x+f.l*.15)+c*(f.x+f.l)+d*(f.x+f.l*.7)+sw*u*u,a*f.y+b*(f.y-f.h*.35)+c*(f.y-f.h*.72)+d*(f.y-f.h)]};
 const ang=u=>{const p=pt(Math.max(0,u-.03)),q=pt(u);return Math.atan2(q[0]-p[0],-(q[1]-p[1]))};
 g.globalAlpha=A*Math.min(1,.5+gr);
 g.lineCap='round';g.lineWidth=1.6+f.z*1.6+f.rad*.03;g.strokeStyle=hs(122,42,15+f.z*14);
 g.beginPath();for(let k=0;k<=18;k++){const p=pt(gr*k/18);k?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])}g.stroke();
 for(const L of f.lv){const s=ease((gr-L.u)/.3);if(s<=0)continue;
  const p=pt(L.u),a=ang(L.u)+L.side*L.ang+sw*.0015*L.side;
  g.save();g.translate(p[0],p[1]);g.rotate(a);g.scale(s,s);
  g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(-L.wid*1.1+L.bend*.5,-L.len*.5,L.bend,-L.len);g.quadraticCurveTo(L.wid*1.1+L.bend*.5,-L.len*.45,0,0);
  g.fillStyle=hs(118,42,17+f.z*12);g.fill();
  g.strokeStyle=hs(110,40,32,.45);g.lineWidth=.8;g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(L.bend*.5,-L.len*.5,L.bend,-L.len*.92);g.stroke();g.restore()}
 const bl=ease((t-f.d-f.gd-f.bs)/f.bd),tip=pt(gr),a=ang(gr);
 if(gr>.85&&bl<.15){g.globalAlpha=A*(1-bl/.15);g.fillStyle=f.bc;g.beginPath();g.arc(tip[0],tip[1],2+f.rad*.08,0,TAU);g.fill()}
 if(bl>.02){
  const p=bl*3,i=Math.min(2,p|0),fr=p-i,tl=f.ty=='tul',sc=f.rad/100*mix(.5,1,Math.min(1,bl*2));
  g.save();g.translate(tip[0],tip[1]);g.rotate(tl?a:a*.5+f.tilt);
  [[f.v[i],1],[f.v[i+1],fr]].forEach(([s,al])=>{if(al<=0)return;g.globalAlpha=A*al;g.drawImage(s.c,-s.ax*sc,-s.ay*sc,s.c.width*sc,s.c.height*sc)});
  g.restore()}
 g.globalAlpha=1}

function frame(now){
 const t=(now-T0)/1000;
 g.setTransform(D,0,0,D,0,0);g.globalAlpha=1;g.fillStyle='#050403';g.fillRect(0,0,W,H);
 const ga=ease(t/2.5)*(.93+.07*Math.sin(t*.9)),gr=Math.min(W*.55,H*.42),gx=W*.5,gy=H*.52;
 const rg=g.createRadialGradient(gx,gy,0,gx,gy,gr);
 rg.addColorStop(0,`rgba(210,135,82,${.52*ga})`);rg.addColorStop(.45,`rgba(140,84,48,${.24*ga})`);rg.addColorStop(1,'rgba(0,0,0,0)');
 g.fillStyle=rg;g.fillRect(0,0,W,H);
 GB.forEach(b=>blade(b,t));F.forEach(f=>flower(f,t));GF.forEach(b=>blade(b,t));
 const fa=ease((t-1)/2);
 if(fa>0)P.forEach(p=>{
  const x=p.x+Math.sin(t*p.sp+p.ph)*22,y=((p.y-t*p.vy)%H+H)%H,a=fa*(.25+.75*(.5+.5*Math.sin(t*p.sp*3+p.ph)));
  g.fillStyle=`rgba(255,220,160,${a*.14})`;g.beginPath();g.arc(x,y,p.r*5,0,TAU);g.fill();
  g.fillStyle=`rgba(255,226,170,${a*.95})`;g.beginPath();g.arc(x,y,p.r,0,TAU);g.fill()});
 if(!shown&&t>8){shown=true;document.getElementById('t').classList.add('on')}
 requestAnimationFrame(frame)}

function init(){
 cv.width = W;
 cv.height = H;
}
init();build();
requestAnimationFrame(frame);
})();
</script>
</body></html>
